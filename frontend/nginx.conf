map $host $cmc_app_root {
  default /usr/share/nginx/html/customer;
  cmcrestaurant.app /usr/share/nginx/html/customer;
  staging.cmcrestaurant.app /usr/share/nginx/html/customer;
  order.cmcrestaurant.app /usr/share/nginx/html/ordering;
  order-staging.cmcrestaurant.app /usr/share/nginx/html/ordering;
  admin.cmcrestaurant.app /usr/share/nginx/html/admin;
  admin-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
  staff.cmcrestaurant.app /usr/share/nginx/html/admin;
  staff-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
  kitchen.cmcrestaurant.app /usr/share/nginx/html/admin;
  kitchen-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
}

server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # `img-src` DÙNG KÝ TỰ ĐẠI DIỆN CHO TÊN MIỀN CON, không liệt kê từng môi trường.
  #
  # Màn quản trị tải ảnh món từ tên miền của app ĐẶT MÓN, không từ chính nó — xem
  # `toPublicMenuImageUrl`. Bản trước chỉ cho phép `order.cmcrestaurant.app`, tức tên miền
  # production, nên admin trên staging tải ảnh từ `order-staging.cmcrestaurant.app` và bị trình
  # duyệt CHẶN. Ảnh vỡ ở staging, production thì không — một lỗi chỉ hiện ở đúng một môi trường.
  #
  # Khó tìm vì `curl` không đọc CSP: gọi thẳng URL ảnh trả về 200 và ảnh thật, trông như mọi thứ
  # đều ổn. Chỉ trình duyệt mới chặn.
  #
  # Liệt kê từng môi trường thì mỗi lần thêm môi trường lại hỏng lại. Ký tự đại diện chỉ mở cho
  # tên miền con của chính quán, thứ họ đã sở hữu.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://images.unsplash.com https://api.vietqr.io https://*.cmcrestaurant.app https://cmcrestaurant.app; connect-src 'self' https: wss:; frame-src https://www.google.com; form-action 'self'; upgrade-insecure-requests" always;

  root $cmc_app_root;
  index index.html;

  # Menu photos are copied from the shared frontend public directory. Serve
  # one canonical image directory for every
  # portal host so relative /menu-images URLs cannot fall through to an SPA.
  location ^~ /menu-images/ {
    alias /usr/share/nginx/html/customer/menu-images/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
