version: 2
updates:
  # GitHub Actions used across all workflows
  - package-ecosystem: github-actions
    directory: "/"
    # Nhắm `develop`, KHÔNG nhắm `main`.
    #
    # Mặc định của Dependabot là nhánh mặc định của repo (`main`), tức một bản cập nhật
    # thư viện đi THẲNG vào production mà chưa từng chạy trên staging. Mọi thay đổi khác
    # trong repo này đều đi `develop` -> Deploy Staging -> `main`; không có lý do gì để
    # việc nâng thư viện được miễn phép kiểm ấy.
    #
    # Đo được: 11 PR Dependabot đang mở đều nhắm thẳng `main`.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci


  # Frontend monorepo (npm workspaces)
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      # Batch low-risk dev/test tooling to reduce PR noise.
      dev-tooling:
        patterns:
          - "@types/*"
          - "@vitejs/*"
          - "typescript"

      # HỌ GÓI GHIM CHÉO NHAU THÌ PHẢI ĐI CÙNG CHUYẾN.
      #
      # Không phải để giảm số PR — để PR đó dựng được. `@fortawesome/free-brands-svg-icons` ghim
      # CỨNG `@fortawesome/fontawesome-common-types` đúng một phiên bản. Nâng lẻ nó thì npm cài
      # thêm một bản lồng bên trong, trong khi `react-fontawesome` vẫn giữ bản cũ ở cấp trên — hai
      # bản cùng lúc, hai kiểu `IconName` khác nhau, và `tsc` từ chối hợp nhất:
      #
      #     CustomerHomePage.tsx(592,30): error TS2322:
      #     Type 'IconDefinition' is not assignable to type 'IconProp'.
      #       Type '"cricket-bat"' is not assignable to type 'IconName'.
      #
      # Đo được: PR #190 (7.3.0 -> 7.3.1, một bản vá) làm đỏ `frontend-build`. Một bản nâng vá
      # không thể tự hỏng; nó hỏng vì đi một mình.
      #
      # Gom nhóm khiến Dependabot nâng cả họ trong một PR, npm gộp về một bản, và lớp lỗi này
      # không quay lại — kể cả với gói `@fortawesome/*` nào thêm vào sau này.
      fortawesome:
        patterns:
          - "@fortawesome/*"

